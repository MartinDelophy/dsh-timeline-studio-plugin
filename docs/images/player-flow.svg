<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">From a request to an editable Timeline Studio video</title>
  <desc id="desc">Four-step player journey through DeepSeek Harness and the Timeline Studio plugin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101217"/>
      <stop offset="1" stop-color="#171a23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#68d5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#5b8cff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" rx="36" fill="url(#bg)"/>
  <circle cx="1450" cy="60" r="260" fill="#3b61d1" opacity=".12"/>
  <circle cx="80" cy="650" r="250" fill="#27b5d8" opacity=".08"/>

  <text x="90" y="92" fill="#f6f8ff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">从一句话到可编辑视频</text>
  <text x="90" y="132" fill="#9aa5bd" font-family="Inter, Arial, sans-serif" font-size="22">From one request to an editable Timeline Studio project</text>

  <g filter="url(#shadow)">
    <rect x="90" y="205" width="310" height="330" rx="28" fill="#20232d" stroke="#343947"/>
    <rect x="455" y="205" width="310" height="330" rx="28" fill="#20232d" stroke="#343947"/>
    <rect x="820" y="205" width="310" height="330" rx="28" fill="#20232d" stroke="#343947"/>
    <rect x="1185" y="205" width="325" height="330" rx="28" fill="#20232d" stroke="#343947"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <circle cx="140" cy="257" r="26" fill="url(#accent)"/><text x="140" y="266" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text>
    <path d="M185 254h68v48h-68z" fill="none" stroke="#7cb4ff" stroke-width="5" rx="8"/><path d="M185 270h68" stroke="#7cb4ff" stroke-width="5"/>
    <text x="135" y="350" fill="#f6f8ff" font-size="27" font-weight="700">添加工作区</text>
    <text x="135" y="386" fill="#9aa5bd" font-size="18">Add your workspace</text>
    <text x="135" y="438" fill="#cbd2e0" font-size="18">选择包含 .timeline 工程</text>
    <text x="135" y="468" fill="#cbd2e0" font-size="18">和素材的本地目录</text>

    <circle cx="505" cy="257" r="26" fill="url(#accent)"/><text x="505" y="266" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text>
    <path d="M550 245h70a18 18 0 0 1 18 18v25a18 18 0 0 1-18 18h-34l-17 16v-16h-19a18 18 0 0 1-18-18v-25a18 18 0 0 1 18-18Z" fill="none" stroke="#7cb4ff" stroke-width="5"/>
    <text x="500" y="350" fill="#f6f8ff" font-size="27" font-weight="700">用自然语言提问</text>
    <text x="500" y="386" fill="#9aa5bd" font-size="18">Ask in natural language</text>
    <text x="500" y="438" fill="#cbd2e0" font-size="18">“检查工程，并输出</text>
    <text x="500" y="468" fill="#cbd2e0" font-size="18">一版竖屏 MP4”</text>

    <circle cx="870" cy="257" r="26" fill="url(#accent)"/><text x="870" y="266" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text>
    <path d="M924 243h54l24 24-24 24h-54l-24-24z" fill="none" stroke="#7cb4ff" stroke-width="5"/><circle cx="950" cy="267" r="7" fill="#7cb4ff"/>
    <text x="865" y="350" fill="#f6f8ff" font-size="27" font-weight="700">插件安全执行</text>
    <text x="865" y="386" fill="#9aa5bd" font-size="18">Plugin executes safely</text>
    <text x="865" y="438" fill="#cbd2e0" font-size="18">先理解、再预演，</text>
    <text x="865" y="468" fill="#cbd2e0" font-size="18">确认版本后事务式编辑</text>

    <circle cx="1235" cy="257" r="26" fill="url(#accent)"/><text x="1235" y="266" text-anchor="middle" fill="white" font-size="24" font-weight="700">4</text>
    <rect x="1280" y="239" width="75" height="52" rx="8" fill="none" stroke="#7cb4ff" stroke-width="5"/><path d="m1308 253 25 12-25 13Z" fill="#7cb4ff"/>
    <text x="1230" y="350" fill="#f6f8ff" font-size="27" font-weight="700">获得可编辑结果</text>
    <text x="1230" y="386" fill="#9aa5bd" font-size="18">Receive editable results</text>
    <text x="1230" y="438" fill="#cbd2e0" font-size="18">新的 .timeline 工程</text>
    <text x="1230" y="468" fill="#cbd2e0" font-size="18">以及已验证的 MP4</text>
  </g>

  <g stroke="#5b8cff" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9">
    <path d="M405 370h42"/><path d="M770 370h42"/><path d="M1135 370h42"/>
  </g>
  <rect x="90" y="584" width="1420" height="3" rx="2" fill="url(#accent)" opacity=".75"/>
  <text x="800" y="628" text-anchor="middle" fill="#8590a8" font-family="Inter, Arial, sans-serif" font-size="18">本地文件 · 明确边界 · 可预演 · 可撤销工程 / Local files · Explicit boundaries · Previewable · Editable project</text>
</svg>
